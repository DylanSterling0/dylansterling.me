<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dylan Sterling</title>
  <style>
    /* ===== Reset & Base ===== */
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #07070a;
      color: #c8c8d0;
      line-height: 1.7;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== Background: Premium particles + glow ===== */
    #particles-canvas {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .bg-glow {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .bg-glow .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0;
      animation: orbIn 2s ease forwards;
    }
    .bg-glow .orb:nth-child(1) {
      width: 600px; height: 600px;
      background: radial-gradient(circle, #6366f1, transparent 70%);
      top: -15%; left: -10%;
      animation-delay: .5s;
    }
    .bg-glow .orb:nth-child(2) {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #8b5cf6, transparent 70%);
      bottom: -15%; right: -10%;
      animation-delay: 1s;
    }
    .bg-glow .orb:nth-child(3) {
      width: 350px; height: 350px;
      background: radial-gradient(circle, #06b6d4, transparent 70%);
      top: 40%; left: 60%;
      animation-delay: 1.5s;
    }
    .bg-glow .orb:nth-child(4) {
      width: 250px; height: 250px;
      background: radial-gradient(circle, #a78bfa, transparent 70%);
      top: 60%; left: 15%;
      animation-delay: 2s;
    }
    @keyframes orbIn {
      from { opacity: 0; transform: scale(.6); }
      to { opacity: .12; transform: scale(1); }
    }

    /* ===== Grid overlay ===== */
    .bg-grid {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(transparent 0%, rgba(99, 102, 241, .015) 50%, transparent 100%),
        linear-gradient(90deg, rgba(255,255,255,.012) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,.012) 1px, transparent 1px);
      background-size: 100% 100%, 48px 48px, 48px 48px;
    }

    /* ===== Noise overlay ===== */
    .bg-noise {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 1;
      pointer-events: none;
      opacity: .025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 256px 256px;
    }

    /* ===== Layout ===== */
    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    .container {
      max-width: 640px;
      width: 100%;
    }

    /* ===== Decorative line above name ===== */
    .top-ornament {
      text-align: center;
      margin-bottom: 1.2rem;
      opacity: 0;
      animation: fadeUp .8s ease .1s forwards;
    }
    .top-ornament span {
      display: inline-block;
      width: 32px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #6366f1, transparent);
      vertical-align: middle;
    }

    /* ===== Typography ===== */
    h1 {
      font-size: 3rem;
      font-weight: 800;
      text-align: center;
      letter-spacing: -.03em;
      line-height: 1.15;
      background: linear-gradient(135deg, #e0e0f0 0%, #a5b4fc 35%, #818cf8 65%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: .5rem;
      opacity: 0;
      animation: fadeUp .8s ease .2s forwards;
    }
    .subtitle {
      text-align: center;
      font-size: 1rem;
      color: #777;
      font-weight: 400;
      letter-spacing: .06em;
      margin-bottom: 1.8rem;
      opacity: 0;
      animation: fadeUp .8s ease .3s forwards;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== Bio ===== */
    .bio {
      text-align: center;
      font-size: 1.05rem;
      color: #999;
      margin-bottom: 2.4rem;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
      opacity: 0;
      animation: fadeUp .8s ease .4s forwards;
    }
    .bio em {
      font-style: normal;
      background: linear-gradient(90deg, #a5b4fc, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ===== Social Links ===== */
    .social {
      display: flex;
      gap: .75rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeUp .8s ease .5s forwards;
    }
    .social a {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      padding: .65rem 1.3rem;
      border: 1px solid #1a1a24;
      border-radius: 10px;
      text-decoration: none;
      font-size: .88rem;
      font-weight: 500;
      color: #b0b0b8;
      background: rgba(255,255,255,.02);
      transition: all .25s ease;
      position: relative;
      overflow: hidden;
    }
    .social a::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      opacity: 0;
      transition: opacity .25s ease;
    }
    .social a span, .social a svg { position: relative; z-index: 1; }
    .social a:hover {
      color: #fff;
      border-color: transparent;
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(99, 102, 241, .2);
    }
    .social a:hover::before { opacity: 1; }

    .social a.github:hover { box-shadow: 0 8px 30px rgba(99, 102, 241, .25); }

    /* ===== Section Title ===== */
    .section-title {
      text-align: center;
      font-size: .75rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 1rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeUp .8s ease .55s forwards;
    }

    /* ===== Projects ===== */
    .projects {
      display: flex;
      flex-direction: column;
      gap: .75rem;
      margin-bottom: 3.2rem;
    }
    .project-item {
      padding: 1.1rem 1.3rem;
      border: 1px solid #15151e;
      border-radius: 12px;
      background: rgba(255,255,255,.012);
      backdrop-filter: blur(8px);
      transition: all .35s ease;
      display: flex;
      align-items: center;
      gap: 1rem;
      cursor: pointer;
      opacity: 0;
      animation: fadeUp .8s ease .6s forwards;
    }
    .project-item:nth-child(2) { animation-delay: .65s; }
    .project-item:hover {
      border-color: #252535;
      background: rgba(99, 102, 241, .05);
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(0,0,0,.4);
    }
    .project-icon {
      width: 42px; height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .project-icon.purple { background: rgba(99, 102, 241, .1); }
    .project-icon.cyan { background: rgba(6, 182, 212, .1); }
    .project-info { flex: 1; min-width: 0; }
    .project-name {
      font-size: .95rem;
      font-weight: 600;
      color: #d0d0d8;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .project-name a {
      color: inherit;
      text-decoration: none;
    }
    .project-name a:hover { color: #818cf8; }
    .project-status {
      font-size: .65rem;
      padding: .15rem .45rem;
      border-radius: 5px;
      font-weight: 500;
    }
    .project-status.dev { background: rgba(245, 158, 11, .1); color: #f0b040; }
    .project-desc {
      font-size: .82rem;
      color: #666;
      margin-top: .1rem;
    }

    /* ===== Tech ===== */
    .tech {
      display: flex;
      gap: .5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeUp .8s ease .7s forwards;
    }
    .tech span {
      padding: .3rem .8rem;
      border: 1px solid #15151e;
      border-radius: 6px;
      font-size: .78rem;
      color: #777;
      background: rgba(255,255,255,.015);
      transition: all .2s;
    }
    .tech span:hover {
      border-color: #2a2a3a;
      color: #aaa;
    }

    /* ===== Footer ===== */
    footer {
      text-align: center;
      font-size: .78rem;
      color: #444;
      padding-bottom: 1rem;
      opacity: 0;
      animation: fadeUp .8s ease .75s forwards;
    }
    footer a {
      color: #555;
      text-decoration: none;
      transition: color .2s;
    }
    footer a:hover { color: #818cf8; }

    /* ===== Email indicator ===== */
    .email-note {
      text-align: center;
      font-size: .72rem;
      color: #3a3a45;
      margin-top: .3rem;
    }

    /* ===== Responsive ===== */
    @media (max-width: 480px) {
      h1 { font-size: 2rem; }
      .container { padding: 0; }
      .social a { padding: .55rem 1rem; font-size: .82rem; }
      .project-item { padding: .9rem 1rem; }
    }
  </style>
</head>
<body>
  <!-- Premium Background -->
  <canvas id="particles-canvas"></canvas>
  <div class="bg-glow">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>
  <div class="bg-grid"></div>
  <div class="bg-noise"></div>

  <!-- Main Content -->
  <div class="page">
    <div class="container">

      <!-- Top ornament -->
      <div class="top-ornament"><span></span></div>

      <!-- Name -->

  <!-- Particles -->
  <script>
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let w, h, mouse = { x: -9999, y: -9999 };

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * w;
        this.y = Math.random() * h;
        this.size = Math.random() * 1.8 + .5;
        this.speedX = (Math.random() - .5) * .4;
        this.speedY = (Math.random() - .5) * .4;
        this.opacity = Math.random() * .3 + .05;
        this.hue = Math.random() > .5 ? 240 : 270; // indigo or purple
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        // Mouse interaction: gentle push away
        const dx = this.x - mouse.x;
        const dy = this.y - mouse.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 150) {
          const force = (150 - dist) / 150 * .3;
          this.x += (dx / dist) * force;
          this.y += (dy / dist) * force;
        }
        if (this.x < -20 || this.x > w + 20 || this.y < -20 || this.y > h + 20) this.reset();
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${this.hue}, 50%, 70%, ${this.opacity})`;
        ctx.fill();
      }
    }

    const count = Math.min(80, Math.floor(w * h / 15000));
    for (let i = 0; i < count; i++) particles.push(new Particle());

    let lines = [];
    function drawLines() {
      // Nearest-neighbor connections
      const toDraw = [];
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = dx*dx + dy*dy;
          if (dist < 20000) {
            const opacity = (1 - Math.sqrt(dist) / 142) * .12;
            toDraw.push({ i, j, opacity });
          }
        }
      }
      lines = toDraw;
    }
    // Update lines every 10 frames for performance
    let frameCount = 0;

    function animate() {
      ctx.clearRect(0, 0, w, h);
      frameCount++;
      if (frameCount % 10 === 0) drawLines();

      for (const p of particles) p.update();
      for (const p of particles) p.draw();

      for (const l of lines) {
        const p1 = particles[l.i], p2 = particles[l.j];
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.strokeStyle = `hsla(240, 40%, 70%, ${l.opacity})`;
        ctx.lineWidth = .6;
        ctx.stroke();
      }

      requestAnimationFrame(animate);
    }

    canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    canvas.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });

    animate();
  </script>
</body>
