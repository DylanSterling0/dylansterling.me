<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dylan Sterling</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 640px;
            padding: 2rem;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #888;
            margin-bottom: 2rem;
        }
        .bio {
            font-size: 1rem;
            color: #aaa;
            margin-bottom: 2.5rem;
        }
        .links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .links a {
            color: #667eea;
            text-decoration: none;
            padding: 0.5rem 1.2rem;
            border: 1px solid #333;
            border-radius: 8px;
            transition: all 0.2s;
            font-size: 0.95rem;
        }
        .links a:hover {
            background: #667eea;
            color: #fff;
            border-color: #667eea;
        }
        .projects {
            margin-top: 3rem;
            text-align: left;
        }
        .projects h2 {
            font-size: 1.2rem;
            color: #ccc;
            margin-bottom: 1rem;
            text-align: center;
        }
        .project-item {
            padding: 1rem;
            border: 1px solid #222;
            border-radius: 8px;
            margin-bottom: 0.8rem;
            transition: border-color 0.2s;
        }
        .project-item:hover {
            border-color: #444;
        }
        .project-item a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .project-item p {
            color: #888;
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }
        footer {
            margin-top: 3rem;
            font-size: 0.85rem;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dylan Sterling</h1>
        <p class="subtitle">Developer & Creator</p>
        <p class="bio">
            热爱编程、硬件、折腾。<br>
            正在做自己的移动端 App 和 ESP32 小风扇。
        </p>

        <div class="links">
            <a href="https://github.com/DylanSterling0" target="_blank">GitHub</a>
            <a href="mailto:hello@dylansterling.me">Email</a>
        </div>

        <div class="projects">
            <h2>Projects</h2>
            <div class="project-item">
                <a href="#">📱 App</a>
                <p>移动端 App — 开发中</p>
            </div>
            <div class="project-item">
                <a href="#">🌀 Handheld Fan</a>
                <p>ESP32 + 18650 随身小风扇 — 硬件项目</p>
            </div>
        </div>

        <footer>
            &copy; 2026 Dylan Sterling
        </footer>
    </div>
</body>
</html>
